<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>محاسبه‌گر خورشیدی | هم‌تاب</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pages/calculator.css" />
</head>
<body>
  <main class="container">
    <h1>محاسبه‌گر سیستم خورشیدی</h1>
    <form id="calculator-form">
      <label>قبض ماهانه (تومان) <input type="number" name="monthlyBill" min="0" /></label>
      <label>مصرف ماهانه (کیلووات‌ساعت) <input type="number" name="monthlyUsage" min="0" /></label>
      <label>مساحت سقف (متر مربع) <input type="number" name="roofArea" min="0" /></label>
      <label>درصد استقلال مورد نظر <input type="number" name="independence" min="1" max="100" value="80" /></label>
      <button type="submit" class="btn">محاسبه</button>
    </form>
    <div id="calc-result"></div>
  </main>
  <script src="../js/api-client.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/calculator.js"></script>
</body>
</html>
